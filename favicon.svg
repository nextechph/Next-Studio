<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="black"/>
  <!-- N shape using the hatched stripe technique -->
  <!-- Left vertical bar of N -->
  <polygon points="14,18 26,18 26,82 14,82" fill="white"/>
  <!-- Right vertical bar of N -->
  <polygon points="74,18 86,18 86,82 74,82" fill="white"/>
  <!-- Diagonal stroke of N going top-left to bottom-right -->
  <polygon points="14,18 26,18 86,82 74,82" fill="white"/>
</svg>
